<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Impulsemos el Skate</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="header">
  <div class="eyebrow">Panel privado</div>
  <h1>Admin</h1>
  <div class="sub">Verificación de pagos · Impulsemos el Skate</div>
</header>

<main class="container" style="display:block; max-width:700px">

  <!-- Login simple por PIN (ver README para reemplazar por Firebase Auth) -->
  <section class="card admin-login" id="loginBox">
    <h2>Ingresar</h2>
    <label for="pinInput">PIN del club</label>
    <input type="password" id="pinInput" placeholder="••••" />
    <button class="btn" id="btnLogin">Entrar</button>
    <p style="font-size:12px; color:#777; margin-top:10px">
      Este PIN es solo una barrera básica. Para producción real, cambia esto por
      Firebase Auth (ver README.md, sección "Seguridad del admin").
    </p>
  </section>

  <!-- Grid de boletas -->
  <section class="card" id="panelBox" style="display:none">
    <h2>Boletas <span id="contador" style="font-family:var(--mono); font-size:12px"></span></h2>
    <div id="filtroBoletas" class="codigo-donacion" style="display:none"></div>
    <button class="btn secondary" id="btnReiniciarBoletas" style="margin-bottom:14px">🔄 Reiniciar todas las boletas</button>
    <div class="leyenda">
      <span><i class="dot disponible"></i> Disponible</span>
      <span><i class="dot reservado"></i> Reservado</span>
      <span><i class="dot pagado"></i> Pagado</span>
    </div>
    <div class="wheel-loader-wrap" id="boletasLoaderAdmin">
      <div class="wheel-loader"></div>
      <div class="wheel-loader-text">Cargando boletas...</div>
    </div>
    <div class="boletas-grid oculto" id="boletasGridAdmin"></div>
  </section>

</main>

<!-- Modal de detalle / acciones -->
<div class="modal-backdrop" id="adminModalBackdrop">
  <div class="modal">
    <button class="close" id="adminModalClose">✕</button>
    <h3>Boleta <span id="adminModalNumero"></span></h3>
    <div id="adminModalBadge" style="margin-top:4px"></div>
    <div id="adminModalBody" style="margin-top:12px; font-size:14px"></div>
    <div id="adminModalActions"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
